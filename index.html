<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼국지 천하결전 — 통합 메타 · 편성 · 전법 · 덱빌더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b23a2e'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='serif'%3E天%3C/text%3E%3C/svg%3E">
<meta name="description" content="삼국지 천하결전 통합 메타 사이트 — 시즌별 편성·전법 도감·장수 도감·덱빌더">
<meta name="color-scheme" content="light dark">
<style>
:root{
 --paper:#fff;--bg:#e7e2d6;--ink:#1b1712;--soft:#5f574a;--faint:#8b8375;--line:#e2d9c6;--line2:#c8bda3;--panel:#faf7f0;--panel2:#f1eadb;
 --seal:#b23a2e;--seal2:#8e2c22;--jade:#3f7a5e;--bronze:#9c7a33;--new:#7a58a3;--newbg:#efe7f6;
 --wei:#2f6091;--shu:#3f7a5e;--wu:#b24a34;--qun:#8f6e22;
 --cmd:#2f6091;--act:#b23a2e;--pas:#3f7a5e;--chase:#8f6e22;--leg:#a8842f;--hero:#7a58a3;--rare:#6b7075;
 --t0:#8e2c22;--t1:#9c7a33;--t2:#6b7075;
}
@media(prefers-color-scheme:dark){:root{
 --paper:#17140f;--bg:#0e0c09;--ink:#ece4d3;--soft:#b1a68d;--faint:#8a806f;--line:#2c2619;--line2:#463f2d;--panel:#1d190f;--panel2:#241f13;
 --seal:#df6555;--seal2:#c0553b;--jade:#5fa37e;--bronze:#c7a250;--new:#b394de;--newbg:#2a2233;
 --wei:#5a93c9;--shu:#6fb48c;--wu:#e07458;--qun:#c7a250;
 --cmd:#5a93c9;--act:#df6555;--pas:#5fa37e;--chase:#c7a250;--leg:#c7a250;--hero:#b394de;--rare:#9aa0a6;
 --t0:#df6555;--t1:#c7a250;--t2:#9aa0a6;
}}
:root[data-theme=light]{--paper:#fff;--bg:#e7e2d6;--ink:#1b1712;--soft:#5f574a;--faint:#8b8375;--line:#e2d9c6;--line2:#c8bda3;--panel:#faf7f0;--panel2:#f1eadb;--seal:#b23a2e;--seal2:#8e2c22;--jade:#3f7a5e;--bronze:#9c7a33;--new:#7a58a3;--newbg:#efe7f6;--wei:#2f6091;--shu:#3f7a5e;--wu:#b24a34;--qun:#8f6e22;--cmd:#2f6091;--act:#b23a2e;--pas:#3f7a5e;--chase:#8f6e22;--leg:#a8842f;--hero:#7a58a3;--rare:#6b7075;--t0:#8e2c22;--t1:#9c7a33;--t2:#6b7075;}
:root[data-theme=dark]{--paper:#17140f;--bg:#0e0c09;--ink:#ece4d3;--soft:#b1a68d;--faint:#8a806f;--line:#2c2619;--line2:#463f2d;--panel:#1d190f;--panel2:#241f13;--seal:#df6555;--seal2:#c0553b;--jade:#5fa37e;--bronze:#c7a250;--new:#b394de;--newbg:#2a2233;--wei:#5a93c9;--shu:#6fb48c;--wu:#e07458;--qun:#c7a250;--cmd:#5a93c9;--act:#df6555;--pas:#5fa37e;--chase:#c7a250;--leg:#c7a250;--hero:#b394de;--rare:#9aa0a6;--t0:#df6555;--t1:#c7a250;--t2:#9aa0a6;}
*{box-sizing:border-box;}html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;font-size:14px;-webkit-text-size-adjust:100%;}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,Georgia,serif;}
.cn{font-family:"Nanum Myeongjo",Batang,serif;color:var(--faint);}
.num{font-variant-numeric:tabular-nums;}
a{color:var(--seal);}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;}
.logo{display:flex;align-items:center;gap:9px;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:17px;white-space:nowrap;}
.logo .mk{width:30px;height:30px;border:2px solid var(--seal);border-radius:7px;color:var(--seal);display:grid;place-content:center;font-size:12px;transform:rotate(-3deg);}
.logo em{font-style:normal;color:var(--seal);}
.hbar .sp{flex:1;}
.tbtn{font-family:inherit;font-size:12px;padding:5px 10px;border-radius:100px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);cursor:pointer;}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 10px 8px;display:flex;gap:4px;overflow-x:auto;}
nav.tabs button{font-family:inherit;font-size:13px;font-weight:700;padding:6px 13px;border-radius:100px;border:1px solid transparent;background:transparent;color:var(--soft);cursor:pointer;white-space:nowrap;}
nav.tabs button.on{background:var(--ink);color:var(--paper);}
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px;}
section{display:none;}section.on{display:block;}
h2.head{font-family:"Nanum Myeongjo",serif;font-size:22px;font-weight:800;margin:0 0 4px;}
p.sub{color:var(--soft);font-size:12.5px;margin:0 0 16px;max-width:80ch;}
h3.sub2{font-size:15px;font-weight:800;margin:24px 0 10px;display:flex;align-items:center;gap:8px;}
h3.sub2::before{content:"";width:8px;height:8px;background:var(--seal);border-radius:2px;transform:rotate(45deg);}
/* chips/badges */
.chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:100px;line-height:1.5;white-space:nowrap;}
.f-wei{background:color-mix(in srgb,var(--wei) 15%,transparent);color:var(--wei);}
.f-shu{background:color-mix(in srgb,var(--shu) 15%,transparent);color:var(--shu);}
.f-wu{background:color-mix(in srgb,var(--wu) 15%,transparent);color:var(--wu);}
.f-qun{background:color-mix(in srgb,var(--qun) 15%,transparent);color:var(--qun);}
.tier{display:inline-block;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:11px;color:#fff;padding:1px 8px;border-radius:5px;}
.tier.T0{background:var(--t0);}.tier.T1{background:var(--t1);}.tier.T2{background:var(--t2);}
.ty{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap;}
.ty-지휘{background:var(--cmd);}.ty-액티브{background:var(--act);}.ty-패시브{background:var(--pas);}.ty-추격{background:var(--chase);}.ty-x{background:var(--faint);}
.gr{font-size:10px;font-weight:800;}.gr-전설{color:var(--leg);}.gr-영웅{color:var(--hero);}.gr-희귀{color:var(--rare);}.gr-평범{color:var(--rare);}
.bnew{background:var(--newbg);color:var(--new);border:1px solid var(--new);font-size:9.5px;font-weight:800;padding:0 5px;border-radius:100px;}
.bself{background:color-mix(in srgb,var(--jade) 15%,transparent);color:var(--jade);border:1px solid color-mix(in srgb,var(--jade) 45%,transparent);font-size:9.5px;font-weight:800;padding:0 5px;border-radius:100px;white-space:nowrap;}
.bok{background:color-mix(in srgb,var(--jade) 14%,transparent);color:var(--jade);border:1px solid var(--jade);font-size:9.5px;font-weight:800;padding:0 5px;border-radius:100px;}
/* avatar */
.av{position:relative;width:38px;height:38px;border-radius:8px;overflow:hidden;background:var(--panel2);flex:none;display:inline-block;border:1px solid var(--line2);}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.av b{position:absolute;inset:0;display:grid;place-content:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:15px;color:var(--soft);}
.av.lg{width:54px;height:54px;}.av.lg b{font-size:20px;}
.av.sm{width:30px;height:30px;border-radius:6px;}.av.sm b{font-size:12px;}
/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px;}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:100px;overflow:hidden;}
.seg button{font-family:inherit;font-size:12px;font-weight:700;padding:4px 11px;border:none;background:var(--paper);color:var(--soft);cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--paper);}
.seg button .tn{margin-left:4px;font-size:10px;font-weight:800;opacity:.75;}
.seg button.on .tn{opacity:.9;}
input.search{flex:1;min-width:150px;font-family:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);}
select.fsel{font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);cursor:pointer;}
.ttabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap;border-bottom:2px solid var(--line2);padding-bottom:0;}
.ttabs button{font-family:inherit;font-size:14px;font-weight:800;padding:8px 16px;border:none;background:none;color:var(--soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:7px 7px 0 0;}
.ttabs button:hover{color:var(--ink);background:var(--panel2);}
.ttabs button.on{color:var(--seal);border-bottom-color:var(--seal);}
.ttabs .tn{font-size:11px;font-weight:800;color:var(--faint);background:var(--panel2);border-radius:100px;padding:1px 7px;margin-left:2px;}
.ttabs button.on .tn{color:var(--seal);}
.spill{display:flex;gap:5px;flex-wrap:wrap;}
.spill button{font-family:inherit;font-size:12px;font-weight:800;padding:4px 11px;border-radius:100px;border:1px solid var(--line2);background:var(--paper);color:var(--soft);cursor:pointer;}
.spill button.on{background:var(--seal);color:#fff;border-color:var(--seal);}
/* cards grid */
.grid{display:grid;gap:10px;}
.g-forms{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));}
.g-pair{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:700px){.g-pair{grid-template-columns:1fr;}}
.g-tac{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.g-gen{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
/* formation card */
.fcard{border:1px solid var(--line2);border-radius:10px;background:var(--paper);overflow:hidden;}
.fcard .fh{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel2);border-bottom:1px solid var(--line);}
.fcard .fh .shape{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:14px;}
.frow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px dashed var(--line);cursor:pointer;}
.frow:last-child{border-bottom:none;}
.frow .gi{flex:1;min-width:0;}
.frow .gn{font-weight:800;font-size:13.5px;}
.frow .role{font-size:10px;color:var(--faint);}
.frow .sig{font-size:11px;color:var(--seal);font-weight:700;margin-top:1px;}
.frow .tacmini{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.tacmini .tm{font-size:10.5px;background:var(--panel);border:1px solid var(--line2);border-radius:100px;padding:0 7px;cursor:pointer;color:var(--ink);}
.bfp{color:var(--jade);font-weight:800;font-size:9.5px;}
.tacmini .tm.leg{border-color:var(--leg);color:var(--leg);background:color-mix(in srgb,var(--leg) 12%,transparent);}
.tacmini .tm.hero{border-color:var(--hero);color:var(--hero);background:color-mix(in srgb,var(--hero) 12%,transparent);}
.tacmini .tm.sig{font-weight:800;}
.tacmini .tm.min{opacity:.62;font-size:10px;border-style:dashed;}
.modal.wide{max-width:960px;}
.fcgens{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:640px){.fcgens{grid-template-columns:1fr;}}
.fcg{border:1px solid var(--line2);border-radius:9px;padding:10px 11px;background:var(--panel);}
.kindtag{font-size:9px;font-weight:800;color:var(--faint);border:1px solid var(--line2);border-radius:100px;padding:0 5px;}
.gcardx{border:1px solid var(--line2);border-radius:9px;background:var(--paper);padding:12px 14px;break-inside:avoid;}
.gcardx h4{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--seal);}
.gcardx ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
.gcardx li{font-size:12px;line-height:1.5;color:var(--ink);padding-left:11px;position:relative;}
.gcardx li::before{content:"·";position:absolute;left:0;color:var(--faint);font-weight:800;}
.gtag{font-size:9px;font-weight:800;padding:0 5px;border-radius:100px;white-space:nowrap;}
.g-off{background:color-mix(in srgb,var(--jade) 16%,transparent);color:var(--jade);}
.g-obs{background:color-mix(in srgb,var(--bronze) 20%,transparent);color:var(--bronze);}
.g-trap{background:color-mix(in srgb,var(--seal) 16%,transparent);color:var(--seal);}
.g-tip{background:var(--panel2);color:var(--soft);}
.gnav{display:flex;flex-direction:column;gap:7px;margin:10px 0 4px;}
.gnav-sec{display:flex;align-items:center;gap:6px 7px;flex-wrap:wrap;}
.gnav-lb{font-size:10px;font-weight:800;color:var(--faint);min-width:58px;letter-spacing:.02em;}
.gchip{font-family:inherit;font-size:11.5px;font-weight:700;padding:4px 10px;border:1px solid var(--line2);border-radius:100px;background:var(--paper);color:var(--soft);cursor:pointer;transition:.12s;}
.gchip:hover{border-color:var(--faint);}
.gchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.evtb{border-collapse:collapse;width:100%;font-size:12px;}
.evtb th,.evtb td{border:1px solid var(--line2);padding:4px 8px;text-align:left;white-space:nowrap;}
.evtb th{background:var(--panel2);font-weight:800;font-size:11px;color:var(--soft);}
.evtb td.num{text-align:right;font-variant-numeric:tabular-nums;}
.gcardx.wide{grid-column:1/-1;}
.gtb{border-collapse:collapse;width:100%;font-size:12px;}
.gtb th,.gtb td{border:1px solid var(--line2);padding:5px 9px;text-align:left;vertical-align:top;}
.gtb th{background:var(--panel2);font-weight:800;font-size:11px;color:var(--soft);white-space:nowrap;}
.gtb tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel2) 45%,transparent);}
.gtb td:first-child{font-weight:700;white-space:nowrap;}
/* tactic card */
.tcard{border:1px solid var(--line2);border-radius:9px;background:var(--paper);padding:11px 13px;}
.tcard .th{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px;}
.tcard .kn{font-weight:800;font-size:14px;}.tcard .wo{font-size:10.5px;}
.tcard .sj{margin-left:auto;font-size:9.5px;font-weight:800;color:#fff;background:var(--seal2);padding:1px 7px;border-radius:100px;}
.tcard .meta{font-size:10px;color:var(--faint);margin-bottom:5px;}
.tcard .eff{font-size:11.5px;color:var(--ink);line-height:1.5;}
.tcard .eff.cnonly{color:var(--soft);}
/* general card */
.gcard{border:1px solid var(--line2);border-radius:10px;background:var(--paper);padding:11px;text-align:center;cursor:pointer;}
.gcard .av{margin:0 auto 7px;display:block;}
.gcard .gn{font-weight:800;font-size:13.5px;}
.gcard .st{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:3px;}
/* stat bars */
.stbar{display:grid;grid-template-columns:20px 1fr 34px;gap:6px;align-items:center;font-size:11px;margin:2px 0;}
.stbar .bar{height:9px;background:var(--panel2);border-radius:2px;overflow:hidden;}
.stbar .bar>span{display:block;height:100%;background:var(--seal);}
/* deck builder */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.slot{border:1.5px dashed var(--line2);border-radius:10px;min-height:120px;padding:10px;background:var(--panel);text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.slot.filled{border-style:solid;background:var(--paper);cursor:default;}
.slot .rm{font-size:12px;color:var(--seal);cursor:pointer;border:1px solid var(--line2);border-radius:100px;padding:0 7px;}
.tslot{flex:1;border:1px dashed var(--line2);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--panel);text-align:center;min-height:30px;display:flex;align-items:center;justify-content:center;gap:4px;}
.posrow{display:flex;gap:10px;align-items:stretch;}
.poslabel{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:13px;color:#fff;border-radius:8px;background:var(--t2);text-align:center;}
.poslabel[data-pos="전열"]{background:var(--seal);}
.poslabel[data-pos="후열"]{background:var(--t2);}
/* 진형 6칸 배치 도식 */
.sgrid{display:flex;flex-direction:column;gap:5px;margin:6px 0;}
.sgrow{display:grid;grid-template-columns:44px repeat(3,1fr);gap:5px;align-items:stretch;}
.sglb{display:flex;align-items:center;justify-content:center;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:11px;color:#fff;border-radius:6px;background:var(--t2);}
.sglb[data-pos="전열"]{background:var(--seal);}
.sgc{border:1px solid var(--line2);border-radius:6px;background:var(--panel);padding:5px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;min-height:40px;justify-content:center;}
.sgc b{font-size:11.5px;font-weight:800;line-height:1.2;}
.sgc span{font-size:9.5px;color:var(--faint);}
.sgc.fr{border-color:color-mix(in srgb,var(--seal) 55%,var(--line2));background:color-mix(in srgb,var(--seal) 8%,var(--panel));}
.sgc.bk{border-color:color-mix(in srgb,var(--t2) 55%,var(--line2));}
.sgc.empty{border-style:dashed;background:transparent;opacity:.4;}
.fmcard{border:1px solid var(--line2);border-radius:10px;background:var(--paper);padding:12px 14px;}
.fmcard .fmh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:2px;}
.fmcard .fmh b{font-family:"Nanum Myeongjo",serif;font-size:15px;font-weight:800;}
.fmcard .fmfeat{font-size:11.5px;color:var(--ink);margin:6px 0 0;}
.fmcard .fmdesc{font-size:11px;color:var(--soft);margin:5px 0 0;}
.fmcard .fmex{font-size:10.5px;color:var(--faint);margin:4px 0 0;}
.g-fm{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
/* S3 티어덱(강덱 합집) */
.tdcell{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.tdcell .tm,.fcg .tm,.tdkv .tm{display:inline-block;font-size:10.5px;background:var(--panel);border:1px solid var(--line2);border-radius:100px;padding:0 7px;color:var(--ink);cursor:pointer;line-height:1.6;}
.tdcell .tm.leg,.fcg .tm.leg,.tdkv .tm.leg{border-color:var(--leg);color:var(--leg);background:color-mix(in srgb,var(--leg) 12%,transparent);}
.tdcell .tm.hero,.fcg .tm.hero,.tdkv .tm.hero{border-color:var(--hero);color:var(--hero);background:color-mix(in srgb,var(--hero) 12%,transparent);}
.tdcell .tm.alt,.fcg .tm.alt,.tdkv .tm.alt,.frow .tacmini .tm.alt{border-style:dashed;opacity:.75;}
.tdcell .tm.nolink,.fcg .tm.nolink,.tdkv .tm.nolink,.frow .tacmini .tm.nolink{cursor:default;color:var(--soft);}
.tdkv .bfx,.tdcell .bfx{font-size:10.5px;color:var(--jade);border:1px solid color-mix(in srgb,var(--jade) 45%,transparent);background:color-mix(in srgb,var(--jade) 10%,transparent);border-radius:100px;padding:0 7px;cursor:pointer;display:inline-block;line-height:1.6;}
.tdkv .bfx.g,.tdcell .bfx.g{border-color:var(--leg);color:var(--leg);background:color-mix(in srgb,var(--leg) 12%,transparent);}
.tdkv .bfx.nolink,.tdcell .bfx.nolink{cursor:default;color:var(--soft);border-color:var(--line2);background:var(--panel);}
.tdstat{font-size:11.5px;font-weight:700;color:var(--seal);}
.modal .mh .shp{font-size:10.5px;font-weight:800;color:var(--bronze);border:1px solid var(--bronze);border-radius:100px;padding:0 7px;cursor:pointer;}
.tdgh{display:flex;gap:7px;align-items:center;}
.tdstat{font-size:11.5px;font-weight:700;color:var(--seal);}
.tdsetlbl{font-size:11px;font-weight:800;color:var(--faint);margin:14px 0 6px;padding-left:2px;}
/* 개척 가이드 */
.g-gk{align-items:start;}
.fcard .fh .shp{font-size:10.5px;font-weight:800;color:var(--bronze);border:1px solid var(--bronze);border-radius:100px;padding:0 7px;cursor:pointer;}
.gk-wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start;}
@media(max-width:900px){.gk-wrap{grid-template-columns:1fr;}}
.gkday{margin-bottom:11px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--paper);}
.gkdh{background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 11px;font-weight:800;font-size:13px;font-family:"Nanum Myeongjo",serif;}
.gksteps{margin:0;padding:8px 11px 9px 28px;font-size:12px;}
.gksteps li{padding:3px 0;line-height:1.55;}
.gksteps li::marker{color:var(--faint);font-weight:800;font-size:10.5px;}
.gknote{border-left:2px solid var(--line2);padding:1px 0 1px 10px;margin-bottom:11px;font-size:12px;line-height:1.55;color:var(--soft);}
.gknh{font-weight:800;font-size:11px;color:var(--seal);margin-bottom:2px;}
.gkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:8px 8px 7px;border-bottom:1px solid var(--line);}
.gkgi{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:11.5px;font-weight:800;cursor:pointer;}
.gktb{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
.gktb td{border-top:1px dashed var(--line);padding:5px 6px;vertical-align:top;word-break:keep-all;}
.gkg-none{padding:7px 9px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--faint);font-weight:700;}
.gktm{border-collapse:collapse;font-size:12px;}
.gktm td{padding:3px 10px 3px 0;vertical-align:top;}
.gktm td:first-child{font-weight:800;white-space:nowrap;color:var(--seal);}
.gktb td.k{width:38px;color:var(--faint);font-size:9.5px;font-weight:800;text-align:center;background:var(--panel);}
.gktb .tm{display:inline-block;font-size:10.5px;background:var(--panel);border:1px solid var(--line2);border-radius:100px;padding:0 7px;color:var(--ink);cursor:pointer;line-height:1.6;margin:1px 2px 1px 0;}
.gktb .tm.leg{border-color:var(--leg);color:var(--leg);background:color-mix(in srgb,var(--leg) 12%,transparent);}
.gktb .tm.hero{border-color:var(--hero);color:var(--hero);background:color-mix(in srgb,var(--hero) 12%,transparent);}
.gktb .tm.alt{border-style:dashed;opacity:.72;}
.gktb .tm.nolink{cursor:default;color:var(--soft);}
.fcard .sq,.modal .sq{font-size:9.5px;font-weight:800;color:#fff;background:var(--jade);border-radius:4px;padding:1px 6px;}
.fcard .tdd{padding:6px 11px;font-size:11px;color:var(--soft);border-bottom:1px solid var(--line);background:var(--panel);}
.fcard .tdd div{padding-left:9px;position:relative;}
.fcard .tdd div::before{content:"·";position:absolute;left:0;color:var(--faint);font-weight:800;}
.fcard .frow .tacmini .tm.min{opacity:.62;border-style:dashed;}
.mtb{border-collapse:collapse;width:100%;font-size:12px;}
.mtb th,.mtb td{border-bottom:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap;}
.mtb thead th{background:var(--panel2);font-size:10.5px;font-weight:800;color:var(--soft);position:sticky;top:0;}
.mtb th.sortable{cursor:pointer;}
.mtb th.sortable:hover{color:var(--ink);}
.mtb th.sortable.on{color:var(--seal);}
.mtb td.num,.mtb th.num{text-align:right;font-variant-numeric:tabular-nums;}
.mtb th.num .cnr{text-align:right;}
.mtb td.num.on{color:var(--seal);font-weight:800;}
.mtb tbody tr:hover{background:var(--panel2);}
.mtb td.mbar{width:120px;padding-right:12px;}
.mtb tr.pred td{opacity:.85;}
.mtb tr.msum td{background:var(--panel);font-weight:800;font-size:11px;border-bottom:2px solid var(--line2);}
.mtb tr.msum td.mut{font-weight:700;}
.mtb th .cnr{display:block;font-size:9px;font-weight:700;opacity:.75;}
.mtb th.k2{color:var(--wei);}.mtb th.k3{color:var(--hero);}.mtb th.k4{color:var(--bronze);}
.mtb th.k1{color:var(--jade);}
.mtb tr.pred td:first-child{border-left:3px solid var(--new);}
.mtb td.mbar>span{display:block;height:9px;border-radius:2px;background:var(--seal);min-width:1px;}
.tdinfo{border:1px solid var(--line2);border-left:4px solid var(--jade);border-radius:6px;background:var(--panel);margin:12px 0;}
.tdinfo>summary{cursor:pointer;padding:9px 13px;font-size:11.5px;color:var(--soft);}
.tdinfo>summary b{color:var(--ink);}
.tdinfo[open]>summary{border-bottom:1px solid var(--line);}
.tdinfo-b{padding:10px 13px 12px;font-size:11.5px;color:var(--soft);line-height:1.62;}
.tdinfo-b p{margin:0 0 7px;}.tdinfo-b p:last-child{margin-bottom:0;}
.tdinfo-b b{color:var(--ink);}
.tdinfo-b .tdh2{display:inline-block;min-width:74px;color:var(--jade);}
.tdkv{display:grid;grid-template-columns:40px 1fr;gap:3px 8px;font-size:11.5px;align-items:start;}
.tdkv .k{color:var(--faint);font-size:10px;font-weight:800;padding-top:2px;}
.sjb{font-size:9px;font-weight:800;color:#fff;background:var(--faint);padding:0 5px;border-radius:100px;vertical-align:middle;}
/* 출시 시즌(한국 환산) 색 — 사이트 전역 통일 */
.sjb.k1{background:var(--jade);}
.sjb.k2{background:var(--wei);}
.sjb.k3{background:var(--hero);}
.sjb.k4{background:var(--bronze);}
.sjb.k5,.sjb.k6{background:var(--rare);}
.sjb.est{box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);}
.sjb.tr::after{content:"·번";font-size:7.5px;opacity:.8;}
.ksw{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:-1px;margin-right:3px;}
.ksw.k1{background:var(--jade);}.ksw.k2{background:var(--wei);}.ksw.k3{background:var(--hero);}
.ksw.k4{background:var(--bronze);}.ksw.k5{background:var(--rare);}
.tsj{font-size:8.5px;font-weight:800;color:var(--faint);margin-left:3px;opacity:.85;}
.tsj.k1{color:var(--jade);}.tsj.k2{color:var(--wei);}.tsj.k3{color:var(--hero);}
.tsj.k4{color:var(--bronze);}.tsj.k5,.tsj.k6{color:var(--rare);}
.synbox{border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:12px 14px;margin-bottom:14px;}
.synbox .syn{padding:6px 0;border-bottom:1px solid var(--line);}
.synbox .syn:last-child{border-bottom:none;}
.synbox .syn.active .nm{color:var(--jade);}
.synbox .syn .nm{font-weight:800;}
/* bars list (meta) */
.rowbar{display:grid;grid-template-columns:150px 1fr 34px;gap:9px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);}
.rowbar .lb b{font-weight:800;}.rowbar .lb .cn{font-size:10px;}
.rowbar .bar{height:12px;background:var(--panel2);border-radius:2px;overflow:hidden;}
.rowbar .bar>span{display:block;height:100%;background:var(--seal);}
.rowbar .bar>span.nw{background:var(--new);}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:8px;}
.kpi{border:1px solid var(--line2);border-top:3px solid var(--seal);border-radius:8px;padding:12px 14px;background:var(--panel);}
.kpi .big{font-family:"Nanum Myeongjo",serif;font-size:22px;font-weight:800;color:var(--seal);}
.kpi h4{margin:0 0 5px;font-size:12px;font-weight:800;}.kpi p{margin:7px 0 0;font-size:11px;color:var(--soft);}
.note{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--bronze);border-radius:6px;padding:10px 13px;font-size:11.5px;color:var(--soft);margin:12px 0;}
.note b{color:var(--ink);}
.tag{display:inline-flex;gap:5px;align-items:baseline;border-radius:100px;padding:2px 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);background:var(--paper);margin:2px;}
.tag.ok{background:color-mix(in srgb,var(--jade) 12%,transparent);border-color:var(--jade);}
.tag.new{background:var(--newbg);border-color:var(--new);}.tag .c{font-size:9.5px;color:var(--faint);}
table{border-collapse:collapse;width:100%;font-size:12px;}
th{text-align:left;padding:6px 8px;background:var(--panel2);border-bottom:2px solid var(--line2);font-size:10.5px;text-transform:uppercase;color:var(--soft);}
td{padding:5px 8px;border-bottom:1px solid var(--line);}
.scroll{overflow-x:auto;border:1px solid var(--line2);border-radius:8px;}
.mut{color:var(--faint);font-size:11px;}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,15,10,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.on{display:flex;}
.modal{background:var(--paper);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.modal .mh{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;}
.modal .mb{padding:16px 18px;}
.modal .x{margin-left:auto;font-size:18px;cursor:pointer;color:var(--faint);border:none;background:none;}
.footer{max-width:1180px;margin:24px auto 0;padding:14px 16px;border-top:1px solid var(--line2);font-size:11px;color:var(--faint);}
@media(max-width:640px){.slots{grid-template-columns:1fr;}.kpis{grid-template-columns:1fr;}.rowbar{grid-template-columns:120px 1fr 30px;}}
</style>

<script>
const D=window.DATA, TAC=D.TAC, GEN=D.GEN, SEA=D.SEASONS, SYN=D.SYN, META=D.META, BF=D.BF||[];
const FAC={wei:'위',shu:'촉',wu:'오',qun:'군'};
const SEASONS=Object.keys(SEA).map(Number).sort((a,b)=>a-b);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AVBASE='https://cdn.sgmdtx.com/img/avatar/';
function avHtml(cn,cls){const g=GEN[cn]||{};const kr=g.kr||cn;const av=g.av;const ini=esc((kr||cn)[0]);
 return `<span class="av ${cls||''}">${av?`<img loading="lazy" src="${AVBASE}${esc(av)}" onerror="this.remove()">`:''}<b>${ini}</b></span>`;}
function facChip(cn){const f=(GEN[cn]||{}).faction;return f?`<span class="chip f-${f}">${FAC[f]}</span>`:'';}
/* ---------- 시즌 환산 (중국 → 한국) ---------- */
const CN2KR=[[1,1,'S1'],[2,3,'S2'],[4,8,'S3'],[9,11,'S4'],[12,14,'S5'],[15,17,'S6']];
const KRPRED={S5:1,S6:1};
function krSj(sj){const m=/^S(\d+)/.exec(String(sj||''));if(!m)return null;const n=+m[1];
 const r=CN2KR.find(x=>n>=x[0]&&n<=x[1]);return r?{kr:r[2],pred:!!KRPRED[r[2]],cn:'S'+n}:null;}
let sjMode='kr';try{sjMode=localStorage.getItem('tenhaSjMode')||'kr';}catch(e){}
function sjLabel(sj){const k=krSj(sj);
 if(!k)return {txt:esc(sj||''),tip:''};
 return sjMode==='kr'
  ?{txt:k.kr+(k.pred?'?':''),tip:'한국 '+k.kr+(k.pred?'(예상)':'')+' = 중국 '+k.cn}
  :{txt:k.cn,tip:'중국 '+k.cn+' = 한국 '+k.kr+(k.pred?'(예상)':'')};}
function toggleSj(){sjMode=sjMode==='kr'?'cn':'kr';
 try{localStorage.setItem('tenhaSjMode',sjMode);}catch(e){}
 const b=document.getElementById('sjBtn');if(b)b.textContent=sjMode==='kr'?'시즌 韓':'시즌 中';
 built={};show((location.hash||'#meta').slice(1));}
function krCls(sj){const k=krSj(sj);return k?'k'+k.kr.slice(1)+(k.pred?' est':''):'';}
function sjBadge(cn){const g=GEN[cn]||{};if(!g.sj)return '';const l=sjLabel(g.sj);
 return `<span class="sjb ${krCls(g.sj)} ${g.official===false?'tr':''}" title="${l.tip}${g.official===false?' · 한국 미수록(임시 번역)':''}">${l.txt}</span>`;}
function tsjB(cn){const s=(TAC[cn]||{}).sj;if(!s)return '';const l=sjLabel(s);
 return `<span class="tsj ${krCls(s)}" title="${l.tip}">${l.txt}</span>`;}
function tyB(t){return t?`<span class="ty ty-${t}">${t}</span>`:'';}
function tName(cn){return (TAC[cn]||{}).kr||cn;}
function isNewTac(cn){const t=TAC[cn];return t&&t.official===false;}
function gradeCls(cn){const g=(TAC[cn]||{}).grade;return g==='전설'?'leg':(g==='영웅'?'hero':'');}

/* ---------------- TABS ---------------- */
const TABS=[['meta','메타'],['td','티어덱'],['gk','개척 가이드'],['season','시즌별 편성'],['srank','시즌 랭킹'],['builder','덱빌더'],['tac','전법 도감'],['bf','병법 도감'],['gen','장수 도감'],['guide','공략·팁'],['ref','참고']];
let built={};
function show(id){
 TABS.forEach(([k])=>{document.getElementById('tab-'+k).classList.toggle('on',k===id);});
 [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('on',b.dataset.k===id));
 if(!built[id]){({meta:renderMeta,td:renderTd,gk:renderGk,season:renderSeason,srank:renderSrank,builder:renderBuilder,tac:renderTac,bf:renderBf,gen:renderGen,guide:renderGuide,ref:renderRef}[id])();built[id]=1;}
 location.hash=id;
}
(function(){const b=document.getElementById('sjBtn');if(b)b.textContent=sjMode==='kr'?'시즌 韓':'시즌 中';})();
document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" onclick="show('${k}')">${l}</button>`).join('');
function toggleTheme(){const r=document.documentElement;const c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');}

/* ---------------- MODAL ---------------- */
function openModal(html,wide){const m=document.getElementById('modal');m.innerHTML=html;m.classList.toggle('wide',!!wide);document.getElementById('ov').classList.add('on');}
function closeModal(){document.getElementById('ov').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function tacModal(cn){const t=TAC[cn]||{};const eff=t.eff?esc(t.eff):'상세 효과 정보 없음.';
 const bfTag=t.bf?`<span class="chip" style="background:var(--panel2);color:var(--jade)">${esc(t.bflbl||'병법')}</span>`:'';
 const own=((t.bfown&&t.bfown.length)?`<div class="mut" style="margin-top:8px">전용 무장 · <b>${t.bfown.map(esc).join(' / ')}</b></div>`:'')
  +(t.rec?`<div class="mut" style="margin-top:6px">韓 공식 추천 · <b>${esc(t.rec)}</b></div>`:'');
 const cn0=t.effcn?`<div class="mut cn" style="margin-top:8px;font-size:12px;line-height:1.5">原文 ${esc(t.effcn)}</div>`:'';
 openModal(`<div class="mh"><b style="font-size:16px">${esc(t.kr||cn)}</b> <span class="cn">${esc(cn)}</span>${t.self?` <span class="bself">본명·${esc(t.self)}</span>`:(t.krOff?' <span class="bself">韓공식명</span>':(t.official===false&&!t.bf?' <span class="bnew">번역</span>':''))}<button class="x" onclick="closeModal()">×</button></div>
 <div class="mb"><div style="margin-bottom:8px">${bfTag} ${tyB(t.ty)} ${t.tx?`<span class="chip" style="background:var(--panel2);color:var(--soft)">${esc(t.tx)}</span>`:''} ${t.grade?`<span class="gr gr-${t.grade}">${t.grade}</span>`:''} ${t.sj?`<span class="chip" style="background:var(--panel2);color:var(--soft)">${esc(t.sj)}</span>`:''} ${t.gl?`<span class="mut">발동 ${esc(t.gl)}</span>`:''}</div>
 <div style="font-size:13px;line-height:1.6">${eff}</div>${own}${cn0}</div>`);}
function bfModal(i){const r=BF[i];if(!r)return;
 const own=(r.own&&r.own.length)?`<div class="mut" style="margin-top:8px">전용 무장 · <b>${r.own.map(esc).join(' / ')}</b></div>`:'';
 const use=(r.use&&r.use.length)?`<div class="mut" style="margin-top:6px">편성 채용 · ${r.use.map(u=>esc(u[0])+'('+u[1]+')').join(', ')}</div>`:'';
 const rec=r.rec?`<div class="mut" style="margin-top:6px">韓 공식 추천 · <b>${esc(r.rec)}</b></div>`:'';
 const cn0=r.effcn?`<div class="mut cn" style="margin-top:8px;font-size:12px;line-height:1.5">原文 ${esc(r.effcn)}</div>`:'';
 openModal(`<div class="mh"><b style="font-size:16px">${esc(r.kr)}</b> <span class="cn">${esc(r.cn)}</span>${r.krOff?' <span class="bself">韓공식명</span>':''}${r.off?'':' <span class="bnew">효과 미공개</span>'}<button class="x" onclick="closeModal()">×</button></div>
 <div class="mb"><div style="margin-bottom:8px"><span class="chip" style="background:var(--panel2);color:var(--jade)">병법 · ${esc(BFLBL[r.kind])}</span>${r.sj?` <span class="chip" style="background:var(--panel2);color:var(--soft)">${esc(r.sj)}</span>`:''}</div>
 <div style="font-size:13px;line-height:1.6">${esc(r.eff||BFNOEFF[r.kind])}</div>${own}${rec}${use}${cn0}</div>`);}
function genModal(cn){const g=GEN[cn]||{};const sk=TAC[g.skill]||{};
 const mx=280;
 const bar=(lb,v)=>`<div class="stbar"><span>${lb}</span><div class="bar"><span style="width:${Math.min(100,(v||0)/mx*100)}%"></span></div><b class="num">${v||'-'}</b></div>`;
 const syns=(g.jb||[]).map(j=>`<div style="padding:5px 0;border-bottom:1px solid var(--line)"><b>${esc(j.name)}</b> <span class="cn">${esc(j.cn)}</span><div class="mut">${(j.member||[]).map(m=>esc((GEN[m]||{}).kr||m)).join(' · ')}</div><div style="font-size:11.5px;color:var(--soft)">${esc(j.desc||'')}</div></div>`).join('')||'<span class="mut">연계 정보 없음</span>';

/* ---------------- META (한국 시즌 환산 · 한국 S1~S4 = 中 S1~S11) ---------------- */
const KSEA=[['S2',[2,3]],['S3',[4,5,6,7,8]],['S4',[9,10,11]]];   // 한국 S2~S4 = 中 S2~S11
let mState={tier:'all',sort:'tot',q:'',view:'gen',mode:'cnt',born:''};   // born: '' | 'S1'~'S4' 출시 시즌 필터
function metaAgg(tier){
 const G={},T={},forms=[];
 KSEA.forEach(([kr,list],i)=>{
  let n=0;
  list.forEach(s=>{(SEA[s]||[]).filter(f=>tier==='all'||f.tier===tier).forEach(f=>{
    n++;
    f.gens.forEach(g=>{
      const r=G[g.cn]||(G[g.cn]={cn:g.cn,tot:0,by:{}});r.tot++;r.by[i]=(r.by[i]||0)+1;
      g.tacs.forEach((t,k)=>{const x=TAC[t]||{};
        if(k===0||x.minimal||x.bf)return;
        const y=T[t]||(T[t]={cn:t,tot:0,by:{}});y.tot++;y.by[i]=(y.by[i]||0)+1;});
    });});});
  forms.push(n);});
 const srt=o=>Object.values(o).sort((a,b)=>b.tot-a.tot||(b.by[2]||0)-(a.by[2]||0));
 const formsBy={};
 KSEA.forEach(([kr,list])=>list.forEach(s2=>{formsBy[s2]=(SEA[s2]||[]).filter(f=>tier==='all'||f.tier===tier).length;}));
 return {gen:srt(G),tac:srt(T),forms:forms,formsBy:formsBy};
}
function krIdx(sj){const k=krSj(sj);if(!k)return null;
 const i=KSEA.findIndex(([kr])=>kr===k.kr);return i<0?null:i;}
function metaRows(rows,isTac,max,forms,formsBy){
 const key=mState.sort, val=r=>key==='tot'?r.tot:(r.by[key]||0);
 const sjNum=sj=>{const m=/^S(\d+)$/.exec(sj||'');return m?+m[1]:0;};
 const avail=(i,born)=>KSEA[i][1].reduce((a,s2)=>a+(s2>=born?(formsBy[s2]||0):0),0);   // 출시 이후 편성만
 const q=nk(mState.q);
 let list=rows.filter(r=>{const O=isTac?(TAC[r.cn]||{}):(GEN[r.cn]||{});
   if(mState.born){const k=krSj(O.sj);if(!k||k.kr!==mState.born)return false;}   // 출시 시즌으로 걸러내기
   const kr=O.kr||r.cn;
   return !q||nk(kr).indexOf(q)>=0||nk(r.cn).indexOf(q)>=0;});
 if(key!=='tot')list=list.slice().sort((a,b)=>val(b)-val(a)||b.tot-a.tot);
 list=list.filter(r=>val(r)>0).slice(0,max);
 const top=Math.max(1,...list.map(val));
 return list.map(r=>{
  const o=isTac?(TAC[r.cn]||{}):(GEN[r.cn]||{});
  const badge=isTac?(o.grade==='전설'?'style="color:var(--leg)"':o.grade==='영웅'?'style="color:var(--hero)"':''):'';
  const born=krIdx(o.sj), bs=sjNum(o.sj);                   // 출시 시즌(한국 환산 열 / 中 번호)
  const cells=KSEA.map(([kr],i)=>{const n=r.by[i]||0;
    const pre=born!=null&&i<born;                            // 그 시즌엔 아직 미출시
    const av=avail(i,bs), p=av?Math.min(100,Math.round(n/av*100)):0;
    const part=av>0&&av<forms[i];                            // 구간 중간에 출시 → 분모가 일부
    const tip=pre?`한국 ${kr} 시점 미출시 (출시 한국 ${KSEA[born][0]})`
      :`한국 ${kr} · ${n}회 / 출시 이후 ${av}편성 = ${p}%${part?` (구간 전체 ${forms[i]}편성 기준 ${forms[i]?Math.round(n/forms[i]*100):0}%)`:''}`;
    const txt=!n?`<span class="mut">${pre?'–':'·'}</span>`
      :(mState.mode==='pct'?p+'<span class="mut">%</span>'+(part?'<span class="mut" title="출시가 구간 중간이라 분모가 일부입니다">*</span>':''):n);
    return `<td class="num ${key==i?'on':''}" title="${tip}">${txt}</td>`;}).join('');
  return `<tr onclick="${isTac?`tacModal('${r.cn}')`:`genModal('${r.cn}')`}" style="cursor:pointer">
   <td><b ${badge}>${esc(o.kr||r.cn)}</b> ${isTac?tsjB(r.cn):sjBadge(r.cn)}${isTac?'':' '+facChip(r.cn)}</td>
   ${cells}<td class="num"><b>${r.tot}</b></td>
   <td class="mbar"><span style="width:${val(r)/top*100}%"></span></td></tr>`;}).join('');
}

function tdTierCls(t){return /^T0/.test(t)?'T0':/^T1(\.|$|-)/.test(t)&&!/^T1\.[2-9]/.test(t)?'T1':'T2';}
/* 전법 칩 */
function tdChip(t,alt){t=String(t||'').replace(/[（()）\[\]]/g,' ').replace(/^[\s\\]+|[\s\\]+$/g,'');if(!t)return '';
 const cn=KRTAC[nk(t)];
 if(!cn)return `<span class="tm nolink ${alt?'alt':''}">${alt?'↔':''}${esc(t)}</span>`;
 return `<span class="tm ${gradeCls(cn)} ${alt?'alt':''}" onclick="event.stopPropagation();tacModal('${cn}')">${alt?'↔':''}${esc(tName(cn))}</span>`;}
function tdSk(lines){const out=[];(lines||[]).forEach(l=>{const alts=[];
  let main=String(l).replace(/[（(]([^）)]*)[）)]/g,(m,x)=>{alts.push(x);return ' ';});
  const op=main.search(/[（(]/);                        // 원문의 닫히지 않은 괄호 = 대체 표기
  if(op>=0){alts.push(main.slice(op+1));main=main.slice(0,op);}
  main.split(/[\/、,+]|→/).forEach(x=>{const c=tdChip(x,false);if(c)out.push(c);});
  alts.forEach(a=>a.split(/[\/、,]/).forEach(x=>{const c=tdChip(x,true);if(c)out.push(c);}));});
 return out.join('');}
/* 공백 무시 인라인 매칭 — 대체 전법처럼 여러 전법이 공백으로 이어진 셀용 */
function tdInline(txt){txt=String(txt||'');
 const idx=[],ch=[];for(let i=0;i<txt.length;i++)if(!/\s/.test(txt[i])){ch.push(txt[i]);idx.push(i);}
 const flat=ch.join(''),used=new Array(flat.length).fill(false),mk=[];
 TACNM.forEach(nm=>{let p=0;while((p=flat.indexOf(nm,p))!==-1){let free=true;
   for(let k=p;k<p+nm.length;k++)if(used[k]){free=false;break;}
   if(free){for(let k=p;k<p+nm.length;k++)used[k]=true;mk.push([idx[p],idx[p+nm.length-1]+1,KRTAC[nm]]);}
   p++;}});
 mk.sort((a,b)=>a[0]-b[0]);let out='',pos=0;
 mk.forEach(m=>{if(m[0]<pos)return;out+=esc(txt.slice(pos,m[0]));
  out+=`<span class="tm ${gradeCls(m[2])}" onclick="event.stopPropagation();tacModal('${m[2]}')">${esc(txt.slice(m[0],m[1]))}</span>`;pos=m[1];});
 out+=esc(txt.slice(pos));return out;}

function tdBook(lines){return (lines||[]).map(l=>{const g=/^[금金][·.]/.test(l);
  let n=String(l).replace(/^[금金][·.]\s*/,'').trim();const key=nk(BFTYPO[nk(n)]||n);const i=BFIDX[key];
  const lb=(g?'<b style="font-size:9px">금</b> ':'')+esc(n);
  return i==null?`<span class="bfx nolink">${lb}</span>`:`<span class="bfx ${g?'g':''}" onclick="event.stopPropagation();bfModal(${i})">${lb}</span>`;}).join(' ');}
function tdSpec(lines){return (lines||[]).map(l=>String(l).split(/[\/、,\s]+/).filter(Boolean).map(n=>{
   const e=SPEC[nk(n).replace(/[\[\]]/g,'')];
   return e?`<span class="tm" onclick="event.stopPropagation();spModal('${esc(nk(n))}')">${esc(n)}</span>`
           :`<span class="tm nolink">${esc(n)}</span>`;}).join('')).join('');}

 <details class="tdinfo"><summary><b>장서각(藏书阁) · 장품도략</b>이란? — 「장서각 조감초」처럼 장서각이 전제인 덱 읽는 법</summary>
  <div class="tdinfo-b">
   <p><b class="tdh2">도략(병서) 칸</b> 무장은 <b>25·30·35레벨</b>에 도략 칸이 1개씩 열려 <b>최대 3칸</b>(해금 동전 1만·3만·5만). 각 칸은 랜덤 3권 중 1권을 연구하며, 후보 9권 안에 <b>같은 계열은 중복 등장하지 않음</b>. 3권을 다 배우면 서간 4개로 재수리(리롤) 가능, <b>10회 이내 전용 금서 보장</b>. <b>전용(專屬) 도략은 무장당 동시 1개만 적용</b>.</p>
   <p><b class="tdh2">장서각</b> 시즌 한정 컨텐츠. 패업 단계 도달(또는 시나리오 6~7일차)에 개방되고 <b>무훈 3만</b>으로 장품도략을 구매. <b>4권</b>이 배치되어 개방 시 2권 + 7일 후 2권 해금. <b>시즌 종료 시 소멸(이월 없음)</b>, 금색 등급은 랜덤 해금·재수리로 획득 불가.</p>
   <p><b class="tdh2">한 권에 3효과?</b> 장품도략 1권이 도략 3권의 효과를 합쳐주는 것은 <b>아님</b> — 칸은 그대로 3칸이고, 장품은 그 중 <b>한 칸</b>에 들어가는 다절 효과의 강력한 한 권(예 손책 《制霸》 후열 피해 500%+체력 100% 회복, 추격 시 1000%/200%, 발동 55%). 대신 <b>전용 금서와는 양립 불가</b>(전용 1개 제한)라는 것이 실제 트레이드오프.</p>
   <p><b class="tdh2">초선의 변화</b> 장서각을 쓰면 전용 금서 《祸水》(폐월 실뎀 −50%, 매 턴 종료 시 무력 최고 아군 연격률 +30%) / 《相怜》(무력 최고 아군 파갑 +9%)을 <b>포기</b>하고 장품 《離間(이간)》을 장착. 지력 기반 발동으로 적에게 <b>혼란</b>을 걸고, 혼란 걸린 적은 아군을 때리므로 <b>병인(무력) 체계·주동덱 카운터</b>가 됨. 역할이 「무력 딜러 버프기 → 혼란 살포 컨트롤러」로 바뀜. 그래서 이 표의 초선 스탯이 통솔·선공 조절형이고, 덱 설명이 “장서각이 있어야만 사용 가능”.</p>
   <p class="mut"><b>미확정</b> · 장품도략을 끼면 남은 2칸(범용)까지 잠기는지는 공식 문구가 없습니다. 다만 이 표와 중섭 편성 DB(sgmdtx) 모두 장품·연의 도략 보유 장수는 <b>그 한 권만 표기</b>되고(같은 편성 동료는 3권 표기) 범용·금서와 섞인 사례가 없어, 실무에선 “장서각 도략 하나로 병서 세팅 끝”으로 취급합니다.</p>
  </div></details>
 ${kinds.length>1?`<div class="ttabs" id="tdKind">
  <button data-k="tier" class="${tdState.kind==='tier'?'on':''}">티어 강덱 <span class="tn">${nT}</span></button>
  <button data-k="coex" class="${tdState.kind==='coex'?'on':''}">5팀 공존 · 출대 루트 <span class="tn">${nC}</span></button></div>`:''}
 <div class="filters"><div class="spill" id="tdGrp">
  <button data-g="all" class="${tdState.grp==='all'?'on':''}">전체</button>
  ${gs.map(g=>`<button data-g="${g.id}" class="${tdState.grp===g.id?'on':''}">${esc(g.label)}</button>`).join('')}</div></div>
 <div class="filters"><input class="search" id="tdQ" placeholder="덱 이름·장수 검색 (예: 초원마, 주태)" value="${esc(tdState.q)}"><span class="mut" id="tdCnt"></span></div>
 <div id="tdBody"></div>`;
 document.getElementById('tdSea').onclick=e=>{const b=e.target.closest('button');if(!b)return;tdState.sea=b.dataset.s;tdState.kind='';tdState.grp='all';renderTd();};
 const kt=document.getElementById('tdKind');
 if(kt)kt.onclick=e=>{const b=e.target.closest('button');if(!b)return;tdState.kind=b.dataset.k;tdState.grp='all';renderTd();};
 document.getElementById('tdGrp').onclick=e=>{const b=e.target.closest('button');if(!b)return;tdState.grp=b.dataset.g;renderTd();};
 const q=document.getElementById('tdQ');q.oninput=()=>{tdState.q=q.value;tdBody();};
 tdBody();
}
function tdBody(){
 const q=nk(tdState.q),list=[],html=[];window._tdList=list;
 tdGroups().filter(g=>tdState.grp==='all'||g.id===tdState.grp).forEach(g=>{
  const ds=g.decks.filter(d=>!q||nk(d.title+d.name+d.gens.map(x=>x.kr).join('')).indexOf(q)>=0);
  if(!ds.length)return;
  html.push(`<h3 class="sub2">${esc(g.label)}${g.sub&&g.sub!==g.label?` <span class="mut" style="font-weight:700">${esc(g.sub)}</span>`:''} <span class="mut">${ds.length}덱 · 原 ${esc(g.cn||'')}</span></h3>`);
  /* 원본 시트는 세트(선발 2팀 등)의 '첫 덱'에만 set 라벨을 넣는다 — 빈 set은 같은 세트의 연속이다.
     세트 라벨이 없는 그룹은 출전 순서(1군)가 다시 나오는 지점을 세트 경계로 본다(대체안 A/B는 제외). */
  let set='',buf=[],seen={};
  const flush=()=>{if(!buf.length)return;
   html.push((set?`<div class="tdsetlbl">${esc(set)}</div>`:'')+`<div class="grid g-forms${buf.length===2?' g-pair':''}">${buf.join('')}</div>`);
   buf=[];seen={};};
  ds.forEach(d=>{const o=d.order||'';
   if(d.set||(o&&seen[o]&&!d.pre)){const ns=d.set||'';flush();set=ns;}
   if(o)seen[o]=1;
   const i=list.push(d)-1;buf.push(tdCard(d,i));});
  flush();});
 document.getElementById('tdBody').innerHTML=html.join('')||'<p class="mut">해당 조건의 덱이 없습니다.</p>';
 document.getElementById('tdCnt').textContent=list.length+'개 덱';
}

function fcardHtml(f,i){
 const gens=f.gens.map(g=>{

const SHAPES=(D.FORMS||[]).map(f=>({

/* 6칸 배치 도식 — 전열 3칸 / 후열 3칸 그리드에서 진형이 쓰는 칸만 채움.
   좌·중·우 위치는 진형마다 다르며 FORMS[].pos(['전열','후열'], o=사용 칸)에 실측값으로 들어있다.
   슬롯 번호는 전열 좌→우, 후열 좌→우 순서이며 피격률 배열 순서와 일치. */
function shapeCells(sh){

 const f=p?use(p[0]):pat(sh.front), b=p?use(p[1]):pat(3-sh.front); let s=0;
 return {front:f.map(v=>v?s++:null), back:b.map(v=>v?s++:null)};
}
function shapeGridHtml(sh,labels){

  if(idx===null) return `<div class="sgc empty"></div>`;

  return `<div class="sgc ${row}">${nm?`<b>${esc(nm)}</b>`:`<b class="mut">${idx+1}번</b>`}<span class="num">피격 ${sh.hit[idx]}%</span></div>`;
 };
 return `<div class="sgrid">
  <div class="sgrow"><span class="sglb" data-pos="전열">전열</span>${c.front.map(i=>cell(i,'fr')).join('')}</div>
  <div class="sgrow"><span class="sglb" data-pos="후열">후열</span>${c.back.map(i=>cell(i,'bk')).join('')}</div>
 </div>`;
}

function evCalc(n){
 const gold=0.08*n;                    // 기대 전설(금색) = 무장 4% + 전법 4%

}
function renderEV(){
 const body=document.getElementById('gbody'); if(!body) return;
 const mile=[5,10,20,50,100,200,300,400];
 const rows=mile.map(n=>{const e=evCalc(n);const note=n===20?'20뽑 천장':n===100?'지정탐방 소원 확정':n===300?'명장팩 자유 선택 1 확정':n===400?'삼황 하드천장':'';
   return `<tr><td class="num">${n}</td><td class="num">${e.gold.toFixed(1)}</td><td class="num">${Math.round(e.p1*100)}%</td><td class="num">${e.wj.toFixed(1)}</td><td class="num">${e.zf.toFixed(1)}</td><td class="mut">${note}</td></tr>`;}).join('');
 const w=document.createElement('div'); w.className='gcardx'; w.style.marginTop='14px';
 w.innerHTML=`<h4>🎲 뽑기 수별 기대값 계산기</h4>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
   <label style="font-size:12px;font-weight:700">뽑기 수</label>
   <input id="evN" type="number" min="1" max="2000" value="300" style="width:78px;font-family:inherit;padding:3px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--paper);color:var(--ink)">
   <input id="evR" type="range" min="1" max="600" value="300" style="flex:1;min-width:120px">
  </div>
  <div id="evOut" style="font-size:12.5px;line-height:1.7"></div>
  <div style="overflow-x:auto;margin-top:10px"><table class="evtb"><thead><tr><th>뽑기</th><th>기대 금색</th><th>금색 1+</th><th>기대 무장</th><th>기대 전법</th><th>비고</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="mut" style="font-size:11px;margin-top:8px">※ KR 공식 확률 기준 근사치 — 상시 인재 모집 카드팩: 전설 무장 4% + 전설 전법 4% = 8%(무장:전법 1:1). 자유 선택(신규 명장팩 300뽑, S2+)·삼황 천장(≈400뽑, 관측)은 확률과 별개의 확정 보장. 5연=390골드(≈1연 78골드).</p>`;
 body.appendChild(w);
 const nEl=document.getElementById('evN'),rEl=document.getElementById('evR'),out=document.getElementById('evOut');
 function upd(n){n=Math.max(1,Math.min(2000,n|0));const e=evCalc(n);
   const cost=Math.round(n*78);
   out.innerHTML=`뽑기 <b>${n}회</b> (≈${cost.toLocaleString()}골드) 기준<br>
    · 기대 금색 <b>${e.gold.toFixed(1)}개</b> · 금색 1개+ 확률 <b>${Math.round(e.p1*100)}%</b><br>
    · 기대 무장 <b>~${e.wj.toFixed(1)}</b> · 기대 전법 <b>~${e.zf.toFixed(1)}</b><br>
    · 명장팩 자유 선택(300뽑) <b>${Math.round(e.jaseon*100)}%</b> 진행 · 삼황 천장(400뽑) <b>${Math.round(e.sanhwang*100)}%</b> 진행${n>=300?' → <span style="color:var(--jade);font-weight:800">자유 선택 1명 확정</span>':''}`;}
 nEl.oninput=()=>{rEl.value=Math.min(600,nEl.value||1);upd(+nEl.value);};
 rEl.oninput=()=>{nEl.value=rEl.value;upd(+rEl.value);};
 upd(300);
}
